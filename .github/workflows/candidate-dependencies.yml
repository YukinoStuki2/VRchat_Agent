        run: |
          import ast,hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path('Candidate~').resolve()
          python=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-locked-env/Scripts/python.exe'
          script=root/'tests/test_runtime_handoff.py'
          tree=ast.parse(script.read_bytes())
