name: Candidate locked dependencies and run identities
on:
  push:
    branches: [candidate-alcom-20260928]
    paths: ['Candidate~/distribution/requirements.*', 'Candidate~/distribution/verify_dependency_install.py','Candidate~/distribution/license_inventory.py','Candidate~/distribution/license-supplements.json','Candidate~/distribution/license-supplements/fastmcp-slim-3.4.7/LICENSE','Candidate~/tests/test_license_inventory.py', 'Candidate~/runtime/candidate_auth.py', 'Candidate~/runtime/run_identity.py', 'Candidate~/tests/test_run_identity.py', 'Candidate~/tests/test_runtime_auth.py','Candidate~/tests/test_client_binding.py','Candidate~/tests/test_runtime_unity_auth.py','Candidate~/tests/test_runtime_lifecycle.py','Candidate~/tests/test_runtime_material.py','Candidate~/tests/unity-core/WirePeer.cs','Candidate~/tests/unity-core/WirePeer.csproj','Candidate~/tests/unity-core/WriteCases.cs','Candidate~/package/Editor/Core/CandidateGate.cs','Candidate~/package/Editor/Core/MaterialCandidateGate.cs', 'Candidate~/experiments/windows_tls_pipe.py', 'Candidate~/runtime/tls*.py', 'Candidate~/tests/test_tls*.py', 'Candidate~/runtime/**', 'Candidate~/launcher/**', 'Candidate~/native/**', 'Candidate~/dependencies/mcp-1.29.1/**', 'Candidate~/tests/test_bootstrap_runtime.py', 'Candidate~/tests/test_owned_launcher.py', 'Candidate~/tests/test_editor_owner.py', 'Candidate~/package/Editor/EditorOwnerProcess.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.csproj', 'Candidate~/tests/unity-core/PortableSelectionCases.cs', '.gitattributes', '.github/workflows/candidate-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-dependencies-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-locked-install:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Create fresh venv and record exact source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dependency-evidence -Force | Out-Null
          git rev-parse HEAD | Set-Content dependency-evidence/commit.txt
          $files = @('Candidate~/distribution/requirements.in','Candidate~/distribution/requirements.lock','Candidate~/distribution/verify_dependency_install.py','Candidate~/distribution/license_inventory.py','Candidate~/distribution/license-supplements.json','Candidate~/distribution/license-supplements/fastmcp-slim-3.4.7/LICENSE','Candidate~/tests/test_license_inventory.py','Candidate~/tests/test_run_identity.py','Candidate~/tests/test_runtime_auth.py','Candidate~/tests/test_client_binding.py','Candidate~/tests/test_runtime_unity_auth.py','Candidate~/tests/test_runtime_lifecycle.py','Candidate~/tests/test_runtime_material.py','Candidate~/tests/unity-core/WirePeer.cs','Candidate~/tests/unity-core/WirePeer.csproj','Candidate~/tests/unity-core/WriteCases.cs','Candidate~/package/Editor/Core/CandidateGate.cs','Candidate~/package/Editor/Core/MaterialCandidateGate.cs','Candidate~/experiments/windows_tls_pipe.py','Candidate~/tests/test_tls_context.py','Candidate~/tests/test_tls_windows.py','Candidate~/tests/test_bootstrap_runtime.py','Candidate~/tests/test_owned_launcher.py', 'Candidate~/tests/test_editor_owner.py', 'Candidate~/package/Editor/EditorOwnerProcess.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.csproj', 'Candidate~/tests/unity-core/PortableSelectionCases.cs','.gitattributes', '.github/workflows/candidate-dependencies.yml') + @(Get-ChildItem 'Candidate~/runtime','Candidate~/launcher','Candidate~/native','Candidate~/dependencies/mcp-1.29.1','Candidate~/package/Editor/Core' -Recurse -File | Where-Object { $_.FullName -notmatch '[\/]__pycache__[\/]' } | ForEach-Object {$_.FullName})
          Get-FileHash $files -Algorithm SHA256 | ConvertTo-Json | Set-Content dependency-evidence/source-before.json
          python -m venv "$env:RUNNER_TEMP/candidate-locked-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact hashed wheels (no resolver-only substitute)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -m pip install --isolated --no-cache-dir --require-hashes --only-binary=:all: --report dependency-evidence/pip-install-report.json -r 'Candidate~/distribution/requirements.lock' 2>&1 | Tee-Object dependency-evidence/install.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -m pip check 2>&1 | Tee-Object dependency-evidence/pip-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read back installed versions and execute real verifier checks
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/distribution/verify_dependency_install.py' dependency-evidence/installed.json 2>&1 | Tee-Object dependency-evidence/imports.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/tests/test_run_identity.py' 2>&1 | Tee-Object dependency-evidence/identity-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = Get-Content dependency-evidence/identity-tests.txt -Raw
          if ($raw -notmatch 'Ran 5 tests' -or $raw -match '(?i)skipped|FAILED|ResourceWarning') { throw 'Identity tests incomplete or warning' }
          if ((Get-Content dependency-evidence/imports.txt -Raw) -match 'ResourceWarning') { throw 'Import ResourceWarning' }
      - name: Actual authenticated probe and client separation
        shell: python
        run: |
          import ast, json, os, pathlib, subprocess, sys
          root=pathlib.Path('Candidate~')
          python=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-locked-env/Scripts/python.exe'
          source=root/'tests/test_runtime_auth.py'
          methods=[node.name+'.'+method.name for node in ast.parse(source.read_text(encoding='utf-8')).body
              if isinstance(node,ast.ClassDef) for method in node.body
              if isinstance(method,(ast.FunctionDef,ast.AsyncFunctionDef)) and method.name.startswith('test_')]
          assert len(methods)==7 and len(set(methods))==7
          rows=[]
          for method in methods:
              code="import sys,runpy;sys.path.insert(0,'Candidate~/dependencies/mcp-1.29.1');sys.argv=['Candidate~/tests/test_runtime_auth.py',sys.argv[1]];assert len(sys.argv)==2;runpy.run_path(sys.argv[0],run_name='__main__')"
              try:
                  result=subprocess.run([str(python),'-I','-B','-W','always::ResourceWarning','-c',code,method],capture_output=True,text=True,timeout=45)
                  row={'method':method,'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr,'timed_out':False}
                  row['passed']=result.returncode==0 and 'Ran 1 test' in result.stderr and not any(x in result.stderr for x in ('ResourceWarning','skipped','FAILED'))
              except subprocess.TimeoutExpired as exc:
                  decode=lambda x: x.decode('utf-8',errors='replace') if isinstance(x,bytes) else x or ''
                  row={'method':method,'passed':False,'timed_out':True,'stdout':decode(exc.stdout),'stderr':decode(exc.stderr)}
              rows.append(row)
              pathlib.Path('dependency-evidence/auth-role-results.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
              print(json.dumps({k:v for k,v in row.items() if k not in ('stdout','stderr')}),flush=True)
          assert all(x['passed'] for x in rows)
      - name: Signed client approval identity and compiled gates (not Unity)
        shell: python
        run: |
          import ast, hashlib, json, os, pathlib, shutil, subprocess, tempfile, urllib.request
          root=pathlib.Path('Candidate~').resolve()
          python=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-locked-env/Scripts/python.exe'
          methods=[node.name+'.'+method.name for node in ast.parse((root/'tests/test_client_binding.py').read_text(encoding='utf-8')).body
              if isinstance(node,ast.ClassDef) for method in node.body
              if isinstance(method,(ast.FunctionDef,ast.AsyncFunctionDef)) and method.name.startswith('test_CB')]
          assert len(methods)==7 and {m.split('.test_')[1].split('_')[0] for m in methods}=={f'CB{i:03d}' for i in range(1,8)}
          report={'scope':'Signed SDK clients and net8 production gates; fixture backend, not native clients/Unity/human approval','rows':[]}
          target=pathlib.Path('dependency-evidence/client-binding-results.json')
          dotnet=shutil.which('dotnet');assert dotnet
          try:
              with tempfile.TemporaryDirectory(prefix='candidate-client-binding-') as td:
                  work=pathlib.Path(td).resolve()
                  source=work/'Response.cs'
                  with urllib.request.urlopen('https://raw.githubusercontent.com/CoplayDev/unity-mcp/30d22075093d1d35dfb0091c1c7550e9ad948577/MCPForUnity/Editor/Helpers/Response.cs',timeout=30) as response:
                      payload=response.read()
                  assert hashlib.sha256(payload).hexdigest()=='a1769de32b9c6824841c070f0590ae7e9f44485d2a6c44a0bce3ed3f68e17391'
                  source.write_bytes(payload)
                  build=subprocess.run([dotnet,'build',str(root/'tests/unity-core/WirePeer.csproj'),'--configuration','Release',
                      '--disable-build-servers','-p:UseSharedCompilation=false','-p:NuGetAudit=false',
                      '-p:BaseIntermediateOutputPath='+str(work/'obj')+'/', '-p:BaseOutputPath='+str(work/'bin')+'/',
                      '-p:CandidateResponseSource='+str(source)],capture_output=True,text=True,timeout=90)
                  report['build']={'exit_code':build.returncode,'stdout':build.stdout,'stderr':build.stderr}
                  assert build.returncode==0
                  dll=work/'bin/Release/net8.0/WirePeer.dll';assert dll.is_file()
                  report['fresh_dll_sha256']=hashlib.sha256(dll.read_bytes()).hexdigest()
                  for method in methods:
                      code=('import sys,unittest;from pathlib import Path;sys.path[:0]='+repr([str(root/'dependencies/mcp-1.29.1'),str(root/'tests')])+';'
                          'import test_client_binding as m;m.WIRE_DLL=Path('+repr(str(dll))+');m.DOTNET=Path('+repr(dotnet)+');'
                          's=unittest.defaultTestLoader.loadTestsFromName('+repr(method)+',m);assert s.countTestCases()==1;'
                          'r=unittest.TextTestRunner(verbosity=2).run(s);raise SystemExit(not r.wasSuccessful() or bool(r.skipped))')
                      try:
                          result=subprocess.run([str(python),'-I','-B','-W','always::ResourceWarning','-c',code],capture_output=True,text=True,timeout=45)
                          row={'method':method,'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr,'timed_out':False}
                          row['passed']=result.returncode==0 and 'Ran 1 test' in result.stderr and not any(x in result.stderr for x in ('ResourceWarning','skipped','FAILED'))
                      except subprocess.TimeoutExpired as exc:
                          decode=lambda x:x.decode('utf-8',errors='replace') if isinstance(x,bytes) else x or ''
                          row={'method':method,'passed':False,'timed_out':True,'stdout':decode(exc.stdout),'stderr':decode(exc.stderr)}
                      report['rows'].append(row)
                      target.write_text(json.dumps(report,indent=2),encoding='utf-8')
                      print(json.dumps({k:v for k,v in row.items() if k not in ('stdout','stderr')}),flush=True)
                  assert hashlib.sha256(source.read_bytes()).hexdigest()=='a1769de32b9c6824841c070f0590ae7e9f44485d2a6c44a0bce3ed3f68e17391'
          finally:
              report['owned_build_directory_absent']='td' in globals() and not pathlib.Path(td).exists()
              report['passed']=report['owned_build_directory_absent'] and len(report['rows'])==len(methods) and all(x['passed'] for x in report['rows'])
              target.write_text(json.dumps(report,indent=2),encoding='utf-8')
          assert report['passed']
      - name: Collect actual locked Windows LICENSE and NOTICE files
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/tests/test_license_inventory.py' 2>&1 | Tee-Object dependency-evidence/license-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = Get-Content dependency-evidence/license-tests.txt -Raw
          if ($raw -notmatch 'Ran 5 tests' -or $raw -match '(?i)skipped|FAILED|ResourceWarning') { throw 'License checks incomplete' }
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/distribution/license_inventory.py' dependency-evidence/licenses 2>&1 | Tee-Object dependency-evidence/license-inventory.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content dependency-evidence/license-inventory.txt -Raw) -match 'ResourceWarning') { throw 'License ResourceWarning' }
          $inventory = Get-Content dependency-evidence/licenses/inventory.json -Raw | ConvertFrom-Json
          $installed = Get-Content dependency-evidence/installed.json -Raw | ConvertFrom-Json
          if (-not $inventory.complete -or $inventory.active_lock_count -ne $installed.active_lock_count) { throw 'Incomplete license inventory' }
      - name: Bounded synthetic TLS pipe feasibility probe (not product approval)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/experiments/windows_tls_pipe.py' dependency-evidence/tls-pipe-probe.json 2>&1 | Tee-Object dependency-evidence/tls-pipe-probe.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content dependency-evidence/tls-pipe-probe.txt -Raw) -match 'ResourceWarning') { throw 'TLS probe ResourceWarning' }
      - name: Real Windows memory TLS loader
        if: always()
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/tests/test_tls_windows.py' 2>&1 | Tee-Object dependency-evidence/tls-windows-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = Get-Content dependency-evidence/tls-windows-tests.txt -Raw
          if ($raw -notmatch 'Ran 5 tests' -or $raw -match '(?i)skipped|FAILED|ResourceWarning') { throw 'TLS tests incomplete or warning' }
      - name: Actual bound CLI and owned Windows supervised runtime
        if: always()
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/tests/test_bootstrap_runtime.py' 2>&1 | Tee-Object dependency-evidence/bootstrap-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = Get-Content dependency-evidence/bootstrap-tests.txt -Raw
          if ($raw -notmatch 'Ran 6 tests' -or $raw -match '(?i)skipped|FAILED|ResourceWarning') { throw 'Bootstrap suite incomplete' }
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/tests/test_owned_launcher.py' 2>&1 | Tee-Object dependency-evidence/owned-launcher-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = Get-Content dependency-evidence/owned-launcher-tests.txt -Raw
          if ($raw -notmatch 'Ran 4 tests' -or $raw -match '(?i)skipped|FAILED|ResourceWarning') { throw 'Owned launcher suite incomplete' }
      - name: Private editor pipes and parent crash on Windows kernel
        if: always()
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/tests/test_editor_owner.py' 2>&1 | Tee-Object dependency-evidence/editor-owner-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = Get-Content dependency-evidence/editor-owner-tests.txt -Raw
          if ($raw -notmatch 'Ran 8 tests' -or $raw -match '(?i)skipped|FAILED|ResourceWarning') { throw 'Editor owner tests incomplete or warning' }
      - name: Actual CSharp private owner with Windows venv
        if: always()
        shell: pwsh
        run: |
          dotnet build 'Candidate~/tests/unity-core/EditorBootstrapCases.csproj' --configuration Release --disable-build-servers -p:UseSharedCompilation=false -p:BaseIntermediateOutputPath="$env:RUNNER_TEMP/editor-csharp/obj/" -p:BaseOutputPath="$env:RUNNER_TEMP/editor-csharp/bin/" 2>&1 | Tee-Object dependency-evidence/editor-csharp-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "CSharp fixture begin" | Set-Content dependency-evidence/editor-csharp-tests.txt
          dotnet "$env:RUNNER_TEMP/editor-csharp/bin/Release/net8.0/EditorBootstrapCases.dll" "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" "$pwd/Candidate~/launcher/editor_owner.py" 2>&1 | Tee-Object dependency-evidence/editor-csharp-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = Get-Content dependency-evidence/editor-csharp-tests.txt -Raw
          if ($raw -notmatch 'PASS ECP001' -or $raw -notmatch 'PASS ECP002') { throw 'CSharp ownership checks incomplete' }
      - name: Verify unchanged bytes and remove owned environment
        if: always()
        shell: pwsh
        run: |
          $files = @('Candidate~/distribution/requirements.in','Candidate~/distribution/requirements.lock','Candidate~/distribution/verify_dependency_install.py','Candidate~/distribution/license_inventory.py','Candidate~/distribution/license-supplements.json','Candidate~/distribution/license-supplements/fastmcp-slim-3.4.7/LICENSE','Candidate~/tests/test_license_inventory.py','Candidate~/tests/test_run_identity.py','Candidate~/tests/test_runtime_auth.py','Candidate~/tests/test_client_binding.py','Candidate~/tests/test_runtime_unity_auth.py','Candidate~/tests/test_runtime_lifecycle.py','Candidate~/tests/test_runtime_material.py','Candidate~/tests/unity-core/WirePeer.cs','Candidate~/tests/unity-core/WirePeer.csproj','Candidate~/tests/unity-core/WriteCases.cs','Candidate~/package/Editor/Core/CandidateGate.cs','Candidate~/package/Editor/Core/MaterialCandidateGate.cs','Candidate~/experiments/windows_tls_pipe.py','Candidate~/tests/test_tls_context.py','Candidate~/tests/test_tls_windows.py','Candidate~/tests/test_bootstrap_runtime.py','Candidate~/tests/test_owned_launcher.py', 'Candidate~/tests/test_editor_owner.py', 'Candidate~/package/Editor/EditorOwnerProcess.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.csproj', 'Candidate~/tests/unity-core/PortableSelectionCases.cs','.gitattributes', '.github/workflows/candidate-dependencies.yml') + @(Get-ChildItem 'Candidate~/runtime','Candidate~/launcher','Candidate~/native','Candidate~/dependencies/mcp-1.29.1','Candidate~/package/Editor/Core' -Recurse -File | Where-Object { $_.FullName -notmatch '[\/]__pycache__[\/]' } | ForEach-Object {$_.FullName})
          Get-FileHash $files -Algorithm SHA256 | ConvertTo-Json | Set-Content dependency-evidence/source-after.json
          if (Test-Path "$env:RUNNER_TEMP/candidate-locked-env") { Remove-Item -Recurse -Force "$env:RUNNER_TEMP/candidate-locked-env" }
          if (Test-Path "$env:RUNNER_TEMP/editor-csharp") { Remove-Item -Recurse -Force "$env:RUNNER_TEMP/editor-csharp" }
          @{csharp_build_absent= -not (Test-Path "$env:RUNNER_TEMP/editor-csharp"); venv_absent= -not (Test-Path "$env:RUNNER_TEMP/candidate-locked-env")} | ConvertTo-Json | Set-Content dependency-evidence/cleanup.json
          if (Test-Path "$env:RUNNER_TEMP/candidate-locked-env") { throw 'Owned venv cleanup failed' }
          if ((Get-Content dependency-evidence/source-before.json -Raw) -ne (Get-Content dependency-evidence/source-after.json -Raw)) { throw 'Source drift' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-windows-dependencies-${{ github.sha }}
          path: dependency-evidence/
          if-no-files-found: error
          retention-days: 7
