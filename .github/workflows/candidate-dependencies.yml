  push:
    branches: [candidate-alcom-20260928]
    paths: ['Candidate~/distribution/requirements.*', 'Candidate~/distribution/verify_dependency_install.py','Candidate~/distribution/license_inventory.py','Candidate~/distribution/license-supplements.json','Candidate~/distribution/license-supplements/fastmcp-slim-3.4.7/LICENSE','Candidate~/tests/test_license_inventory.py', 'Candidate~/runtime/candidate_auth.py', 'Candidate~/runtime/run_identity.py', 'Candidate~/tests/test_run_identity.py', 'Candidate~/tests/test_runtime_auth.py','Candidate~/tests/test_client_binding.py','Candidate~/tests/unity-core/ContinuityCases.cs','Candidate~/tests/unity-core/ContinuityCases.csproj','Candidate~/tests/unity-core/ReloadCases.cs','Candidate~/tests/unity-core/ReloadCases.csproj','Candidate~/tests/unity-core/WriteUnityCases.cs','Candidate~/tests/unity-core/WriteUnityCases.csproj','Candidate~/tests/unity-core/WriteUnityStubs.cs','Candidate~/package/Editor/UnityMaterialCandidateBackend.cs','Candidate~/tests/test_client_selection.py','Candidate~/tests/unity-core/ClientAdmissionCases.cs','Candidate~/package/Editor/CandidateSession.cs','Candidate~/tests/test_runtime_pause.py','Candidate~/tests/test_runtime_reload.py','Candidate~/tests/test_runtime_handoff.py','Candidate~/launcher/peer_identity.py','Candidate~/launcher/peer_channel.py','Candidate~/tests/test_peer_identity.py','Candidate~/tests/test_peer_channel.py','Candidate~/tests/verify_peer.py', 'Candidate~/runtime/reload_control.py', 'Candidate~/launcher/reload_owner.py', 'Candidate~/tests/test_reload_control.py', 'Candidate~/tests/verify_editor_wire.py','Candidate~/tests/test_editor_control.py','Candidate~/tests/test_editor_reload.py','Candidate~/tests/test_editor_orchestration.py','Candidate~/tests/unity-core/EditorOrchestrationCases.cs','Candidate~/tests/unity-core/EditorRestoreCases.cs','Candidate~/package/Editor/CandidateReload.cs', 'Candidate~/tests/test_reload_wire.py', 'Candidate~/tests/test_editor_peer.py', 'Candidate~/package/Editor/EditorPeerChannel.cs', 'Candidate~/tests/unity-core/EditorPeerCases.cs', 'Candidate~/tests/unity-core/EditorPeerCases.csproj', 'Candidate~/tests/unity-core/EditorPeerNetStandard.csproj','Candidate~/package/Editor/CandidateWindow.cs','Candidate~/package/Editor/MaterialCandidateSession.cs','Candidate~/tests/test_runtime_unity_auth.py','Candidate~/tests/test_runtime_lifecycle.py','Candidate~/tests/test_runtime_material.py','Candidate~/tests/unity-core/WirePeer.cs','Candidate~/tests/unity-core/WirePeer.csproj','Candidate~/tests/unity-core/ConsoleNativeCases.cs','Candidate~/tests/unity-core/ConsoleNativeCases.csproj','Candidate~/tests/unity-core/SceneNativeCases.cs','Candidate~/tests/unity-core/SceneNativeCases.csproj','Candidate~/tests/unity-core/AnimatorNativeFixture.cs','Candidate~/tests/unity-core/ProjectMetadataFixture.cs','Candidate~/tests/unity-core/EditorMetadataFixture.cs','Candidate~/tests/unity-core/MenuMetadataFixture.cs','Candidate~/tests/unity-core/PackageMetadataFixture.cs','Candidate~/tests/unity-core/ProjectResourceApiStubs.cs','Candidate~/tests/scene_native_source.py','Candidate~/tests/source_native_source.py','Candidate~/distribution/materialize_reflection.py','Candidate~/tests/test_reflection_source.py','Candidate~/package/Editor/ScopedReflection/LICENSE.md.meta','Candidate~/package/Editor/ScopedReflection/PROVENANCE.json.meta','Candidate~/package/Editor/ScopedReflection/CandidateScopedUnityReflect.cs.meta','Candidate~/package/Editor/ScopedReflection/PROVENANCE.json','Candidate~/package/Editor/ScopedReflection/CandidateReflection.asmref','Candidate~/package/Editor/ScopedReflection/LICENSE.md','Candidate~/package/Editor/ScopedReflection/CandidateReflection.asmref.meta','Candidate~/package/Editor/ScopedReflection/CandidateScopedUnityReflect.cs','Candidate~/tests/unity-core/SourceReadCases.cs','Candidate~/tests/unity-core/SourceReadCases.csproj','Candidate~/package/Editor/NativeReadContract.cs','Candidate~/tests/test_runtime.py','Candidate~/tests/unity-core/WriteCases.cs','Candidate~/package/Editor/Core/CandidateGate.cs','Candidate~/package/Editor/Core/MaterialCandidateGate.cs', 'Candidate~/experiments/windows_tls_pipe.py', 'Candidate~/runtime/tls*.py', 'Candidate~/tests/test_tls*.py', 'Candidate~/runtime/**', 'Candidate~/launcher/**', 'Candidate~/native/**', 'Candidate~/dependencies/mcp-1.29.1/**', 'Candidate~/tests/test_bootstrap_runtime.py', 'Candidate~/tests/test_owned_launcher.py', 'Candidate~/tests/test_editor_owner.py','Candidate~/tests/test_private_process_pipes.py','Candidate~/tests/test_editor_delivery.py','Candidate~/tests/test_codex_local.py','Candidate~/tests/test_native_peer_cleanup.py','Candidate~/tests/native_approved_tasks.py','Candidate~/tests/test_operation_catalog.py', 'Candidate~/package/Editor/EditorOwnerProcess.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.csproj', 'Candidate~/tests/unity-core/PortableSelectionCases.cs', '.gitattributes', '.github/workflows/candidate-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-dependencies-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-locked-install:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Create fresh venv and record exact source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dependency-evidence -Force | Out-Null
          git rev-parse HEAD | Set-Content dependency-evidence/commit.txt
          $files = @('Candidate~/distribution/requirements.in','Candidate~/distribution/requirements.lock','Candidate~/distribution/verify_dependency_install.py','Candidate~/distribution/license_inventory.py','Candidate~/distribution/license-supplements.json','Candidate~/distribution/license-supplements/fastmcp-slim-3.4.7/LICENSE','Candidate~/tests/test_license_inventory.py','Candidate~/tests/test_run_identity.py','Candidate~/tests/test_runtime_auth.py','Candidate~/tests/test_client_binding.py','Candidate~/tests/unity-core/ContinuityCases.cs','Candidate~/tests/unity-core/ContinuityCases.csproj','Candidate~/tests/unity-core/ReloadCases.cs','Candidate~/tests/unity-core/ReloadCases.csproj','Candidate~/tests/unity-core/WriteUnityCases.cs','Candidate~/tests/unity-core/WriteUnityCases.csproj','Candidate~/tests/unity-core/WriteUnityStubs.cs','Candidate~/package/Editor/UnityMaterialCandidateBackend.cs','Candidate~/tests/test_client_selection.py','Candidate~/tests/unity-core/ClientAdmissionCases.cs','Candidate~/package/Editor/CandidateSession.cs','Candidate~/tests/test_runtime_pause.py','Candidate~/tests/test_runtime_reload.py','Candidate~/tests/test_runtime_handoff.py','Candidate~/launcher/peer_identity.py','Candidate~/launcher/peer_channel.py','Candidate~/tests/test_peer_identity.py','Candidate~/tests/test_peer_channel.py','Candidate~/tests/verify_peer.py', 'Candidate~/runtime/reload_control.py', 'Candidate~/launcher/reload_owner.py', 'Candidate~/tests/test_reload_control.py', 'Candidate~/tests/verify_editor_wire.py','Candidate~/tests/test_editor_control.py','Candidate~/tests/test_editor_reload.py','Candidate~/tests/test_editor_orchestration.py','Candidate~/tests/unity-core/EditorOrchestrationCases.cs','Candidate~/tests/unity-core/EditorRestoreCases.cs','Candidate~/package/Editor/CandidateReload.cs', 'Candidate~/tests/test_reload_wire.py', 'Candidate~/tests/test_editor_peer.py', 'Candidate~/package/Editor/EditorPeerChannel.cs', 'Candidate~/tests/unity-core/EditorPeerCases.cs', 'Candidate~/tests/unity-core/EditorPeerCases.csproj', 'Candidate~/tests/unity-core/EditorPeerNetStandard.csproj','Candidate~/package/Editor/CandidateWindow.cs','Candidate~/package/Editor/MaterialCandidateSession.cs','Candidate~/tests/test_runtime_unity_auth.py','Candidate~/tests/test_runtime_lifecycle.py','Candidate~/tests/test_runtime_material.py','Candidate~/tests/unity-core/WirePeer.cs','Candidate~/tests/unity-core/WirePeer.csproj','Candidate~/tests/unity-core/ConsoleNativeCases.cs','Candidate~/tests/unity-core/ConsoleNativeCases.csproj','Candidate~/tests/unity-core/SceneNativeCases.cs','Candidate~/tests/unity-core/SceneNativeCases.csproj','Candidate~/tests/unity-core/AnimatorNativeFixture.cs','Candidate~/tests/unity-core/ProjectMetadataFixture.cs','Candidate~/tests/unity-core/EditorMetadataFixture.cs','Candidate~/tests/unity-core/MenuMetadataFixture.cs','Candidate~/tests/unity-core/PackageMetadataFixture.cs','Candidate~/tests/unity-core/ProjectResourceApiStubs.cs','Candidate~/tests/scene_native_source.py','Candidate~/tests/source_native_source.py','Candidate~/distribution/materialize_reflection.py','Candidate~/tests/test_reflection_source.py','Candidate~/package/Editor/ScopedReflection/LICENSE.md.meta','Candidate~/package/Editor/ScopedReflection/PROVENANCE.json.meta','Candidate~/package/Editor/ScopedReflection/CandidateScopedUnityReflect.cs.meta','Candidate~/package/Editor/ScopedReflection/PROVENANCE.json','Candidate~/package/Editor/ScopedReflection/CandidateReflection.asmref','Candidate~/package/Editor/ScopedReflection/LICENSE.md','Candidate~/package/Editor/ScopedReflection/CandidateReflection.asmref.meta','Candidate~/package/Editor/ScopedReflection/CandidateScopedUnityReflect.cs','Candidate~/tests/unity-core/SourceReadCases.cs','Candidate~/tests/unity-core/SourceReadCases.csproj','Candidate~/package/Editor/NativeReadContract.cs','Candidate~/tests/test_runtime.py','Candidate~/tests/unity-core/WriteCases.cs','Candidate~/package/Editor/Core/CandidateGate.cs','Candidate~/package/Editor/Core/MaterialCandidateGate.cs','Candidate~/experiments/windows_tls_pipe.py','Candidate~/tests/test_tls_context.py','Candidate~/tests/test_tls_windows.py','Candidate~/tests/test_bootstrap_runtime.py','Candidate~/tests/test_owned_launcher.py', 'Candidate~/tests/test_editor_owner.py','Candidate~/tests/test_private_process_pipes.py','Candidate~/tests/test_editor_delivery.py','Candidate~/tests/test_codex_local.py','Candidate~/tests/test_native_peer_cleanup.py','Candidate~/tests/native_approved_tasks.py','Candidate~/tests/test_operation_catalog.py', 'Candidate~/package/Editor/EditorOwnerProcess.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.cs', 'Candidate~/tests/unity-core/EditorBootstrapCases.csproj', 'Candidate~/tests/unity-core/PortableSelectionCases.cs','.gitattributes', '.github/workflows/candidate-dependencies.yml') + @(Get-ChildItem 'Candidate~/runtime','Candidate~/launcher','Candidate~/catalog','Candidate~/native','Candidate~/dependencies/mcp-1.29.1','Candidate~/package/Editor','Candidate~/tests/unity-core/AdapterOwnedFixture.cs','Candidate~/tests/unity-core/OwnedTransportDouble.cs' -Recurse -File | Where-Object { $_.FullName -notmatch '[\/]__pycache__[\/]' } | ForEach-Object {$_.FullName})
          $files = @($files | ForEach-Object { (Resolve-Path $_).Path } | Sort-Object -Unique)
          Get-FileHash $files -Algorithm SHA256 | ConvertTo-Json | Set-Content dependency-evidence/source-before.json
          python -m venv "$env:RUNNER_TEMP/candidate-locked-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact hashed wheels (no resolver-only substitute)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -m pip install --isolated --no-cache-dir --require-hashes --only-binary=:all: --report dependency-evidence/pip-install-report.json -r 'Candidate~/distribution/requirements.lock' 2>&1 | Tee-Object dependency-evidence/install.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -m pip check 2>&1 | Tee-Object dependency-evidence/pip-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read back installed versions and execute real verifier checks
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/distribution/verify_dependency_install.py' dependency-evidence/installed.json 2>&1 | Tee-Object dependency-evidence/imports.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/candidate-locked-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/tests/test_run_identity.py' 2>&1 | Tee-Object dependency-evidence/identity-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = Get-Content dependency-evidence/identity-tests.txt -Raw
          if ($raw -notmatch 'Ran 5 tests' -or $raw -match '(?i)skipped|FAILED|ResourceWarning') { throw 'Identity tests incomplete or warning' }
          if ((Get-Content dependency-evidence/imports.txt -Raw) -match 'ResourceWarning') { throw 'Import ResourceWarning' }
      - name: Actual authenticated probe and client separation
        shell: python
        run: |
          import ast, json, os, pathlib, subprocess, sys
          root=pathlib.Path('Candidate~')
          python=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-locked-env/Scripts/python.exe'
          source=root/'tests/test_runtime_auth.py'
          methods=[node.name+'.'+method.name for node in ast.parse(source.read_text(encoding='utf-8')).body
              if isinstance(node,ast.ClassDef) for method in node.body
              if isinstance(method,(ast.FunctionDef,ast.AsyncFunctionDef)) and method.name.startswith('test_')]
          assert len(methods)==8 and {m.split('.test_')[1].split('_')[0] for m in methods}=={f'AU{i:03d}' for i in range(1,9)}
          rows=[]
          for method in methods:
              code="import sys,runpy;sys.path.insert(0,'Candidate~/dependencies/mcp-1.29.1');sys.argv=['Candidate~/tests/test_runtime_auth.py',sys.argv[1]];assert len(sys.argv)==2;runpy.run_path(sys.argv[0],run_name='__main__')"
              try:
                  result=subprocess.run([str(python),'-I','-B','-W','always::ResourceWarning','-c',code,method],capture_output=True,text=True,timeout=45)
                  row={'method':method,'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr,'timed_out':False}
                  row['passed']=result.returncode==0 and 'Ran 1 test' in result.stderr and not any(x in result.stderr for x in ('ResourceWarning','skipped','FAILED'))
              except subprocess.TimeoutExpired as exc:
                  decode=lambda x: x.decode('utf-8',errors='replace') if isinstance(x,bytes) else x or ''
                  row={'method':method,'passed':False,'timed_out':True,'stdout':decode(exc.stdout),'stderr':decode(exc.stderr)}
              rows.append(row)
              pathlib.Path('dependency-evidence/auth-role-results.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
              print(json.dumps({k:v for k,v in row.items() if k not in ('stdout','stderr')}),flush=True)
          assert all(x['passed'] for x in rows)
      - name: Signed client approval identity and compiled gates (not Unity)
        shell: python
        run: |
          import ast, hashlib, json, os, pathlib, shutil, subprocess, tempfile, urllib.request
          root=pathlib.Path('Candidate~').resolve()
          python=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-locked-env/Scripts/python.exe'
          methods=[node.name+'.'+method.name for node in ast.parse((root/'tests/test_client_binding.py').read_text(encoding='utf-8')).body
              if isinstance(node,ast.ClassDef) for method in node.body
              if isinstance(method,(ast.FunctionDef,ast.AsyncFunctionDef)) and method.name.startswith('test_CB')]
          assert len(methods)==7 and {m.split('.test_')[1].split('_')[0] for m in methods}=={f'CB{i:03d}' for i in range(1,8)}
          report={'scope':'Signed SDK clients and net8 production gates; fixture backend, not native clients/Unity/human approval','rows':[]}
          target=pathlib.Path('dependency-evidence/client-binding-results.json')
          expected_console_ids={f'RT{i:03d}' for i in range(15,43)}
          dotnet=shutil.which('dotnet');assert dotnet
          try:
              with tempfile.TemporaryDirectory(prefix='candidate-client-binding-') as td:
                  work=pathlib.Path(td).resolve()
                  native=work/'native';native.mkdir()
                  import importlib.util
                  spec=importlib.util.spec_from_file_location('scene_native_source',root/'tests/scene_native_source.py')
                  scene=importlib.util.module_from_spec(spec);spec.loader.exec_module(scene)
                  source_spec=importlib.util.spec_from_file_location('source_native_source',root/'tests/source_native_source.py')
                  source_reader=importlib.util.module_from_spec(source_spec);source_spec.loader.exec_module(source_reader)
                  native_hashes={**source_reader.PINS, **scene.FIND_PINS, 'Tools/ManageScene.cs': scene.PIN, 'Helpers/Response.cs': 'a1769de32b9c6824841c070f0590ae7e9f44485d2a6c44a0bce3ed3f68e17391', 'Tools/ReadConsole.cs': '80950f3ff610b845d34644aa0426775c7e1bfc20483c912c004067d43dfb119f', 'Helpers/ToolParams.cs': 'f708345c2913672011a7050ddceb96141a22f0880c9dfea65ebfb5b50c792abc', 'Helpers/ParamCoercion.cs': '69b425c49152a31d68e80d0a6498c78c406989242214a8f9b760b6936b17670b', 'Helpers/StringCaseUtility.cs': '5758c84d56fd4a3420aede775ddd1ca7cc8e0854476bedf65a1a9bca437cd411'}
                  for name,digest in native_hashes.items():
                      with urllib.request.urlopen('https://raw.githubusercontent.com/CoplayDev/unity-mcp/30d22075093d1d35dfb0091c1c7550e9ad948577/MCPForUnity/Editor/'+name,timeout=30) as response:
                          payload=response.read()
                      assert hashlib.sha256(payload).hexdigest()==digest
                      target_source=native/name;target_source.parent.mkdir(parents=True,exist_ok=True);target_source.write_bytes(payload)
                  source=native/'Helpers/Response.cs'
                  report['native_source_hashes']=native_hashes
                  build=subprocess.run([dotnet,'build',str(root/'tests/unity-core/WirePeer.csproj'),'--configuration','Release',
                      '--disable-build-servers','-p:UseSharedCompilation=false','-p:NuGetAudit=false',
                      '-p:BaseIntermediateOutputPath='+str(work/'obj')+'/', '-p:BaseOutputPath='+str(work/'bin')+'/',
                      '-p:CandidateResponseSource='+str(source),'-p:CandidateNativeRoot='+str(native)],capture_output=True,text=True,timeout=90)
                  report['build']={'exit_code':build.returncode,'stdout':build.stdout,'stderr':build.stderr}
                  assert build.returncode==0
                  dll=work/'bin/Release/net8.0/WirePeer.dll';assert dll.is_file()
                  report['fresh_dll_sha256']=hashlib.sha256(dll.read_bytes()).hexdigest()
                  for method in methods:
                      code=('import sys,unittest;from pathlib import Path;sys.path[:0]='+repr([str(root/'dependencies/mcp-1.29.1'),str(root/'tests')])+';'
                          'import test_client_binding as m;m.WIRE_DLL=Path('+repr(str(dll))+');m.DOTNET=Path('+repr(dotnet)+');'
                          's=unittest.defaultTestLoader.loadTestsFromName('+repr(method)+',m);assert s.countTestCases()==1;'
                          'r=unittest.TextTestRunner(verbosity=2).run(s);raise SystemExit(not r.wasSuccessful() or bool(r.skipped))')
                      try:
                          result=subprocess.run([str(python),'-I','-B','-W','always::ResourceWarning','-c',code],capture_output=True,text=True,timeout=45)
                          row={'method':method,'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr,'timed_out':False}
                          row['passed']=result.returncode==0 and 'Ran 1 test' in result.stderr and not any(x in result.stderr for x in ('ResourceWarning','skipped','FAILED'))
                      except subprocess.TimeoutExpired as exc:
                          decode=lambda x:x.decode('utf-8',errors='replace') if isinstance(x,bytes) else x or ''
                          row={'method':method,'passed':False,'timed_out':True,'stdout':decode(exc.stdout),'stderr':decode(exc.stderr)}
                      report['rows'].append(row)
                      target.write_text(json.dumps(report,indent=2),encoding='utf-8')
                      print(json.dumps({k:v for k,v in row.items() if k not in ('stdout','stderr')}),flush=True)
                  import re
                  build=subprocess.run([dotnet,'build',str(root/'tests/unity-core/ConsoleNativeCases.csproj'),'--configuration','Release',
                      '--disable-build-servers','-p:UseSharedCompilation=false','-p:NuGetAudit=false',
                      '-p:BaseIntermediateOutputPath='+str(work/'console-obj')+'/', '-p:BaseOutputPath='+str(work/'console-bin')+'/',
                      '-p:CandidateNativeRoot='+str(native)],capture_output=True,text=True,timeout=90)
                  report['console_build']={'exit_code':build.returncode,'stdout':build.stdout,'stderr':build.stderr}
                  assert build.returncode==0
                  result=subprocess.run([dotnet,str(work/'console-bin/Release/net8.0/ConsoleNativeCases.dll')],capture_output=True,text=True,timeout=30)
                  report['console_native']={'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr,
                      'ids':sorted(re.findall(r'^PASS (NC[0-9]{3}) ',result.stdout,re.M))}
                  assert result.returncode==0 and report['console_native']['ids']==[f'NC{i:03d}' for i in range(1,5)]
                  report['scene_native_source']=scene.assemble(native,work/'ManageScene.cs')
                  build=subprocess.run([dotnet,'build',str(root/'tests/unity-core/SceneNativeCases.csproj'),'--configuration','Release',
                      '--disable-build-servers','-p:UseSharedCompilation=false','-p:NuGetAudit=false',
                      '-p:BaseIntermediateOutputPath='+str(work/'scene-obj')+'/', '-p:BaseOutputPath='+str(work/'scene-bin')+'/',
                      '-p:CandidateNativeRoot='+str(native),'-p:SceneNativeSource='+str(work/'ManageScene.cs')],capture_output=True,text=True,timeout=90)
                  report['scene_build']={'exit_code':build.returncode,'stdout':build.stdout,'stderr':build.stderr}
                  assert build.returncode==0
                  result=subprocess.run([dotnet,str(work/'scene-bin/Release/net8.0/SceneNativeCases.dll')],capture_output=True,text=True,timeout=30)
                  report['scene_native']={'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr,
                      'ids':sorted(re.findall(r'^PASS (NS[0-9]{3}) ',result.stdout,re.M))}
                  assert result.returncode==0 and report['scene_native']['ids']==[f'NS{i:03d}' for i in range(1,19)]
                  report['source_native_source']=source_reader.assemble(native,work/'ManageSource.cs')
                  build=subprocess.run([dotnet,'build',str(root/'tests/unity-core/SourceReadCases.csproj'),'--configuration','Release',
                      '--disable-build-servers','-p:UseSharedCompilation=false','-p:NuGetAudit=false',
                      '-p:BaseIntermediateOutputPath='+str(work/'source-obj')+'/', '-p:BaseOutputPath='+str(work/'source-bin')+'/',
                      '-p:NativeEditorRoot='+str(native),'-p:CandidateSourceNative='+str(work/'ManageSource.cs')],capture_output=True,text=True,timeout=90)
                  report['source_build']={'exit_code':build.returncode,'stdout':build.stdout,'stderr':build.stderr}
                  assert build.returncode==0 and not re.search(r'ResourceWarning|(?i:\bwarning\s+[A-Z]+\d+:)',build.stdout+'\n'+build.stderr)
                  result=subprocess.run([dotnet,str(work/'source-bin/Release/net8.0/SourceReadCases.dll')],capture_output=True,text=True,timeout=30)
                  report['source_native']={'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr,
                      'ids':sorted(re.findall(r'^PASS (ST[0-9]{3}) ',result.stdout,re.M))}
                  assert result.returncode==0 and report['source_native']['ids']==[f'ST{i:03d}' for i in range(1,12)]
                  console_methods=[cls.name+'.'+m.name for cls in ast.parse((root/'tests/test_runtime.py').read_text(encoding='utf-8')).body
                      if isinstance(cls,ast.ClassDef) for m in cls.body if isinstance(m,(ast.FunctionDef,ast.AsyncFunctionDef)) and m.name.startswith('test_RT') and m.name.split('_')[1] in expected_console_ids]
                  assert len(console_methods)==len(expected_console_ids) and {m.split('.test_')[1].split('_')[0] for m in console_methods}==expected_console_ids
                  report['console_runtime']=[]
                  for method in console_methods:
                      code="import sys,runpy;sys.path[:0]="+repr([str(root/'dependencies/mcp-1.29.1'),str(root/'tests')])+";sys.argv=["+repr(str(root/'tests/test_runtime.py'))+", "+repr(method)+"];runpy.run_path(sys.argv[0],run_name='__main__')"
                      result=subprocess.run([str(python),'-I','-B','-W','always::ResourceWarning','-c',code],capture_output=True,text=True,timeout=45)
                      row={'method':method,'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr}
                      row['passed']=result.returncode==0 and 'Ran 1 test' in result.stderr and not any(x in result.stderr for x in ('ResourceWarning','skipped','FAILED'))
                      report['console_runtime'].append(row)
