              for method in node.body if isinstance(method,ast.AsyncFunctionDef) and method.name.startswith('test_')]
          assert sorted(m.split('.test_')[1].split('_')[0] for m in methods)==[f'HF{i:03}' for i in range(1,16)]
          sources=[script,root/'runtime/candidate_runtime.py',root/'runtime/material_runtime.py',root/'runtime/unity_ingress.py',root/'tests/test_runtime_unity_auth.py']
          before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sources}
          def case_passed(row,method):
              name=method.split('.')[-1]
              headers=re.findall(r'^'+re.escape(name)+r' \([^\n]*'+re.escape(method)+r'\) \.\.\. ',row['stderr'],re.M)
              return (row['exit_code']==0 and not row['timed_out'] and len(headers)==1
                  and len(re.findall(r'^Ran 1 test in ',row['stderr'],re.M))==1
                  and len(re.findall(r'^OK$',row['stderr'],re.M))==1
                  and not any(x in row['stdout']+row['stderr'] for x in ('ResourceWarning','skipped','FAILED')))
          target=pathlib.Path('dependency-evidence/reload-handoff-results.json');rows=[]
          for method in methods:
              try:
                  result=subprocess.run([str(python),'-I','-B','-W','always::ResourceWarning',str(script),method],capture_output=True,text=True,encoding='utf-8',timeout=45)
                  row={'method':method,'exit_code':result.returncode,'timed_out':False,'stdout':result.stdout,'stderr':result.stderr}
                  row['passed']=case_passed(row,method)
              except subprocess.TimeoutExpired:
                  row={'method':method,'passed':False,'timed_out':True}
              rows.append(row)
              target.write_text(json.dumps({'rows':rows,'source_before':before},indent=2),encoding='utf-8')
          after={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sources}
          passed=len(rows)==len(methods) and all(row['passed'] for row in rows) and before==after
          target.write_text(json.dumps({'rows':rows,'source_before':before,'source_after':after,'passed':passed},indent=2),encoding='utf-8')
          assert passed
