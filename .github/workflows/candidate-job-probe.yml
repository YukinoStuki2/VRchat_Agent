name: Candidate bounded Windows Job investigation (not approval)
on:
  push:
    branches: [candidate-alcom-20260928]
    paths: ['Candidate~/experiments/job_exit_probe.py', 'Candidate~/experiments/test_job_exit_probe.py', '.github/workflows/candidate-job-probe.yml']
permissions:
  contents: read
concurrency:
  group: candidate-job-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      # Per-process checkout policy; no host or production config write.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Locked disposable environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path job-evidence | Out-Null
          python -m venv "$env:RUNNER_TEMP/candidate-job-probe-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/candidate-job-probe-env/Scripts/python.exe" -m pip install --isolated --no-cache-dir --require-hashes --only-binary=:all: -r 'Candidate~/distribution/requirements.lock' 2>&1 | Tee-Object job-evidence/install.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Control flow and original native verdicts
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate-job-probe-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/experiments/test_job_exit_probe.py' 2>&1 | Tee-Object job-evidence/control-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/candidate-job-probe-env/Scripts/python.exe" -I -B -W always::ResourceWarning 'Candidate~/experiments/job_exit_probe.py' job-evidence/probe signal-race 2>&1 | Tee-Object job-evidence/probe.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove only owned environment
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP/candidate-job-probe-env") { Remove-Item -Recurse -Force "$env:RUNNER_TEMP/candidate-job-probe-env" }
          @{venv_absent= -not (Test-Path "$env:RUNNER_TEMP/candidate-job-probe-env")} | ConvertTo-Json | Set-Content job-evidence/cleanup.json
          if (Test-Path "$env:RUNNER_TEMP/candidate-job-probe-env") { throw 'Owned environment remains' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-job-probe-${{ github.sha }}
          path: job-evidence/
          if-no-files-found: error
          retention-days: 7
