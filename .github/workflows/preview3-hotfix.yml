name: Publish CS7036 fix
on:
  push:
    tags: ['hermes-preview-0.2.0-preview.3']
permissions: {}
jobs:
  publish:
    if: github.repository == 'YukinoStuki2/VRchat_Agent' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build only from digest-checked public predecessor
        run: |
          set -eu
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/previous.zip" https://github.com/YukinoStuki2/VRchat_Agent/releases/download/hermes-preview-0.2.0-preview.2/com.yukino.vrchat-agent-0.2.0-preview.2.zip
          python3 -IB hotfix/build.py "$RUNNER_TEMP/previous.zip" "$RUNNER_TEMP/out"
      - name: Upload, read back, and publish the new prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: hermes-preview-0.2.0-preview.3
          REPO: YukinoStuki2/VRchat_Agent
        run: |
          set -eu
          gh release create "$TAG" "$RUNNER_TEMP/out/"* --repo "$REPO" --verify-tag --draft --prerelease --latest=false --title 'VRChat Agent 0.2.0-preview.3 · Unity CS7036 修复' --notes-file hotfix/release-notes.md
          gh release download "$TAG" --repo "$REPO" --dir "$RUNNER_TEMP/downloaded"
          diff --recursive --brief "$RUNNER_TEMP/out" "$RUNNER_TEMP/downloaded"
          gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false
